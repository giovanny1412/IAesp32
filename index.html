<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controlador ESP32 con Agente IA Gemini</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 650px; margin: auto; }
    h2 { color: #38bdf8; margin-top: 0; }
    label { font-size: 14px; font-weight: bold; color: #94a3b8; display: block; margin-top: 15px; }
    select, input, button { padding: 12px; margin-top: 5px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #334155; font-size: 14px; }
    input, select { background: #0f172a; color: #fff; }
    button { background: #0284c7; color: white; font-weight: bold; border: none; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .btn-connect { background: #16a34a; }
    .btn-connect:hover { background: #15803d; }
    #log { background: #020617; color: #38bdf8; padding: 12px; height: 260px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; border-radius: 6px; border: 1px solid #1e293b; margin-top: 15px; font-size: 13px; }
    .code-out { color: #4ade80; }
    .err-out { color: #f87171; }
    .info-out { color: #fbbf24; }
    .warn-out { color: #fb923c; }
  </style>
<base target="_blank">
</head>
<body>

<div class="card">
  <h2>🤖 Agente MicroPython ESP32 + Gemini</h2>

  <label for="apiKey">1. Tu API Key de Gemini:</label>
  <input type="password" id="apiKey" placeholder="AIzaSy..." />

  <label for="board">2. Selecciona tu placa ESP32:</label>
  <select id="board">
    <option value="ESP32 Dev Module Estándar (Pin LED típico: 2)">ESP32 Dev Module (Estándar)</option>
    <option value="ESP32-C3 (Pin LED típico: 8, pines IO: 0-21)">ESP32-C3</option>
    <option value="ESP32-S3 (Pin LED típico: 47/RGB en 48, dual USB)">ESP32-S3</option>
    <option value="ESP32-C6 (Pin LED típico: 8/15)">ESP32-C6</option>
  </select>

  <button id="btnConnect" class="btn-connect" onclick="connectSerial()">3. Conectar ESP32 por USB</button>

  <label for="prompt">4. Orden para el Agente IA:</label>
  <input type="text" id="prompt" placeholder="Ej: Enciende el LED en el pin 8 o Haz parpadear el pin 2 tres veces" disabled />
  <button id="btnSend" onclick="processAICommand()" disabled>Enviar Orden a la IA</button>

  <label>Consola / Registro de Ejecución:</label>
  <div id="log">Esperando conexión por USB y API Key...<br></div>
</div>

<script>
let port = null;
let writer = null;
let reader = null;
let readLoopRunning = false;

// Verificar soporte de Web Serial al cargar
if (!navigator.serial) {
  log("<span class='err-out'>❌ Tu navegador NO soporta Web Serial API. Usa Google Chrome o Microsoft Edge.</span>");
  log("<span class='warn-out'>⚠️ Firefox y Safari NO funcionan. Asegúrate de abrir este archivo por HTTP/HTTPS o localhost.</span>");
}

// 1. Conexión Serial por WebSerial API
async function connectSerial() {
  // Verificar soporte
  if (!navigator.serial) {
    log("<span class='err-out'>❌ ERROR: Web Serial API no disponible. Usa Chrome/Edge.</span>");
    alert("Tu navegador no soporta Web Serial API.\nUsa Google Chrome o Microsoft Edge.\nFirefox y Safari NO funcionan.");
    return;
  }

  try {
    // Si ya hay un puerto abierto, cerrarlo primero
    if (port && port.readable) {
      await disconnectSerial();
    }

    log("🔍 Solicitando puerto USB...");

    // Solicitar puerto al usuario
    port = await navigator.serial.requestPort();

    log("🔓 Abriendo puerto a 115200 baudios...");
    await port.open({ baudRate: 115200 });

    // Configurar escritura
    const textEncoder = new TextEncoderStream();
    const writableClosed = textEncoder.readable.pipeTo(port.writable);
    writer = textEncoder.writable.getWriter();

    // Configurar lectura (opcional, no bloquea si falla)
    try {
      const textDecoder = new TextDecoderStream();
      const readableClosed = port.readable.pipeTo(textDecoder.writable);
      reader = textDecoder.readable.getReader();
      startReading();
    } catch (readErr) {
      log("<span class='warn-out'>⚠️ No se pudo iniciar lectura: " + readErr.message + "</span>");
    }

    // Habilitar controles
    document.getElementById('prompt').disabled = false;
    document.getElementById('btnSend').disabled = false;
    document.getElementById('btnConnect').innerText = "✓ ESP32 Conectado por USB";
    document.getElementById('btnConnect').classList.remove('btn-connect');
    document.getElementById('btnConnect').style.background = '#dc2626';
    document.getElementById('btnConnect').onclick = disconnectSerial;

    log("<span class='code-out'>🔌 Conectado con éxito al ESP32.</span>");

  } catch (err) {
    if (err.name === 'NotFoundError') {
      log("<span class='warn-out'>⚠️ No seleccionaste ningún puerto USB.</span>");
    } else if (err.name === 'SecurityError') {
      log("<span class='err-out'>❌ Error de seguridad: la página debe estar en HTTPS o localhost.</span>");
    } else {
      log("<span class='err-out'>❌ Error de conexión USB: " + err.name + " - " + err.message + "</span>");
    }
  }
}

// Desconectar
async function disconnectSerial() {
  try {
    if (reader) {
      await reader.cancel();
      reader = null;
    }
    if (writer) {
      await writer.close();
      writer = null;
    }
    if (port) {
      await port.close();
      port = null;
    }
  } catch (e) {
    // Ignorar errores al cerrar
  }

  readLoopRunning = false;
  document.getElementById('prompt').disabled = true;
  document.getElementById('btnSend').disabled = true;
  document.getElementById('btnConnect').innerText = "3. Conectar ESP32 por USB";
  document.getElementById('btnConnect').classList.add('btn-connect');
  document.getElementById('btnConnect').style.background = '';
  document.getElementById('btnConnect').onclick = connectSerial;
  log("🔌 Desconectado del ESP32.");
}

// Leer respuestas del ESP32
async function startReading() {
  if (readLoopRunning || !reader) return;
  readLoopRunning = true;

  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value) {
        const clean = value.replace(/\x04/g, '').replace(/\x03/g, '').replace(/\r/g, '').trim();
        if (clean && clean.length > 0 && !clean.startsWith('>>>') && !clean.startsWith('...')) {
          log("<span class='info-out'>📟 ESP32: " + clean.replace(/\n/g, ' | ') + "</span>");
        }
      }
    }
  } catch (e) {
    // Puerto cerrado
  } finally {
    readLoopRunning = false;
  }
}

// 2. Enviar código al ESP32 - línea por línea con delay
async function sendToESP32(code) {
  if (!writer) {
    log("<span class='err-out'>❌ No hay conexión con el ESP32.</span>");
    return;
  }

  // Separar por líneas (ya sean ; o \n)
  const lines = code.split(/;|\n/).map(l => l.trim()).filter(l => l.length > 0);

  if (lines.length === 0) {
    log("<span class='warn-out'>⚠️ No hay código para enviar.</span>");
    return;
  }

  log("<span class='code-out'>📤 Enviando " + lines.length + " comando(s)...</span>");

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    try {
      await writer.write(line + "\r\n");
      log("<span class='code-out'>>>> " + line.substring(0, 80) + (line.length > 80 ? "..." : "") + "</span>");
      await new Promise(r => setTimeout(r, 200));
    } catch (writeErr) {
      log("<span class='err-out'>❌ Error enviando línea: " + writeErr.message + "</span>");
      break;
    }
  }

  log("<span class='code-out'>✅ Envío completado.</span>");
}

// 3. Consulta a la API de Gemini
async function processAICommand() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const userPrompt = document.getElementById('prompt').value.trim();
  const boardInfo = document.getElementById('board').value;

  if (!apiKey) {
    alert("Por favor ingresa tu API Key de Gemini.");
    return;
  }
  if (!userPrompt) return;
  if (!writer) {
    log("<span class='err-out'>❌ Primero conecta el ESP32 por USB.</span>");
    return;
  }

  log("🧠 Agente IA procesando orden con Gemini...");
  document.getElementById('btnSend').disabled = true;

  const systemInstruction = `Eres un agente compilador de MicroPython para microcontroladores ESP32. 
  Tu única función es traducir la instrucción del usuario en CÓDIGO MICROPYTHON ejecutable.
  Reglas:
  1. Responde ÚNICAMENTE con el código en MicroPython, una instrucción por línea.
  2. NO use bloques markdown (\`\`\`python), NINGUNA explicación.
  3. Si piden LED RGB / Neopixel, usa el módulo 'neopixel'.
  4. Importa los módulos necesarios (machine, time, neopixel).
  5. Usa time.sleep() para delays, NO uses bucles while infinitos.
  Placa objetivo: ${boardInfo}.`;

  const url = `https://generativelanguage.googleapis.com/v1/models/gemini-3.5-flash:generateContent?key=${apiKey}`;

  const payload = {
    contents: [
      {
        role: "user",
        parts: [
          { text: systemInstruction },
          { text: `Instrucción: ${userPrompt}` }
        ]
      }
    ],
    generationConfig: {
      temperature: 0.1
    }
  };

  try {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    if (data.candidates && data.candidates[0].content.parts[0].text) {
      let code = data.candidates[0].content.parts[0].text.trim();
      code = code.replace(/```python/g, '').replace(/```/g, '').trim();

      log("💡 Código generado:");
      code.split("\n").forEach(l => {
        if (l.trim()) log("<span class='code-out'>   " + l.trim() + "</span>");
      });

      await sendToESP32(code);
    } else {
      log("<span class='err-out'>❌ Error en API: " + JSON.stringify(data) + "</span>");
    }
  } catch (error) {
    log("<span class='err-out'>❌ Error de red/petición: " + error + "</span>");
  } finally {
    document.getElementById('btnSend').disabled = false;
  }
}

function log(text) {
  const logDiv = document.getElementById('log');
  logDiv.innerHTML += text + "<br>";
  logDiv.scrollTop = logDiv.scrollHeight;
}
</script>

</body>
</html>
